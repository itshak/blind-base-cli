name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  wheel:
    name: Build wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tool
        run: python -m pip install --upgrade build
      - name: Build
        run: python -m build # creates dist/*.whl and dist/*.tar.gz
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: blindbase-pypi
          path: dist/*

  mac-arm:
    name: Build macOS arm64 binary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tcl-tk
        run: brew install tcl-tk
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build arm64 binary
        run: bash packaging/build_mac_arm.sh
      - name: Upload artefact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: blindbase-mac-arm64
          path: dist/blindbase_mac_arm64

  mac-x86:
    name: Build macOS x86_64 binary
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tcl-tk
        run: brew install tcl-tk
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build x86_64 binary
        run: |
          # Ensure Rosetta is installed and working
          if ! arch -x86_64 true &>/dev/null; then
            echo "[!] Rosetta is not installed. Please install Rosetta first."
            exit 1
          fi
          
          # Run the build script under Rosetta
          arch -x86_64 bash packaging/build_mac_x86.sh
      - name: Upload artefact (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: blindbase-mac-x86_64
          path: dist/blindbase_mac_x86_64

  windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build exe
        run: python packaging/build_windows.py
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: blindbase-win
          path: dist/blindbase.exe

  publish:
    name: Publish GitHub Release
    needs: [wheel, mac-arm, mac-x86, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for creating a release and uploading assets
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist_release
          merge-multiple: true

      - name: List downloaded files (debug)
        run: ls -R dist_release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          files: |
            dist_release/*.whl
            dist_release/*.tar.gz
            dist_release/blindbase_mac_arm64
            dist_release/blindbase_mac_x86_64
            dist_release/blindbase.exe

  pypi-publish:
    needs: publish
    runs-on: ubuntu-latest
    environment: release # ← same as you typed on PyPI
    permissions:
      id-token: write # OIDC credential for PyPI
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blindbase-pypi
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # no 'password:' line → OIDC trusted-publisher mode
